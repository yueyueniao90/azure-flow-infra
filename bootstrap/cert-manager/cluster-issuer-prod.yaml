# Let's Encrypt's production ACME server: real, browser-trusted certificates, and tight rate limits
# (see bootstrap/cert-manager/README.md, "Rate limits"). Only switch an Ingress to this issuer after
# cluster-issuer-staging.yaml has issued a certificate cleanly on the same cluster.
#
# Applied by the captain with bootstrap/cert-manager/install.sh, never by a pipeline: see bootstrap/cert-manager/README.md.
# install.sh substitutes the captain's address (--email) for the placeholder in a temporary copy; a real email
# address is never committed to this public repo, so the placeholder below is deliberately not one (no "@").
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: REPLACE-WITH-YOUR-EMAIL-BEFORE-APPLYING
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: webapprouting.kubernetes.azure.com
